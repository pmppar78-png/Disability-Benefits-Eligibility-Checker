[build]
  publish = "."
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------------------------
# Redirects – single canonical host: https://disabilitytrustai.com
# HTTP → HTTPS is enforced automatically by Netlify infrastructure.
# These rules handle www → apex, .html cleanup, and duplicate-path cleanup.
# Order: most-specific first, generic catch-alls last.
# ---------------------------------------------------------------------------

# www + index.html → apex root (single hop)
[[redirects]]
  from = "https://www.disabilitytrustai.com/index.html"
  to = "https://disabilitytrustai.com/"
  status = 301
  force = true

# www + .html → apex clean URL (single hop, eliminates chain)
[[redirects]]
  from = "https://www.disabilitytrustai.com/*.html"
  to = "https://disabilitytrustai.com/:splat"
  status = 301
  force = true

# www → apex (generic catch-all)
[[redirects]]
  from = "https://www.disabilitytrustai.com/*"
  to = "https://disabilitytrustai.com/:splat"
  status = 301
  force = true

# Root duplicates → /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# .html → clean URL
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Headers – explicit indexability signals, security, and caching
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
