[build]
  publish = "."
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------------------------
# Redirects – single canonical host: https://disabilitytrustai.com
#
# Principle: ONLY host/scheme canonicalization redirects. Every real content
# URL (clean URL and its .html source) returns 200 and is de-duplicated by a
# self-referencing <link rel="canonical">. This guarantees Google is never
# asked to index a redirecting content URL — eliminating "Page with redirect".
#
# HTTP → HTTPS is enforced automatically by Netlify infrastructure.
# ---------------------------------------------------------------------------

# www → apex (single canonical host, single hop)
[[redirects]]
  from = "https://www.disabilitytrustai.com/*"
  to = "https://disabilitytrustai.com/:splat"
  status = 301
  force = true

# Homepage path aliases (no such files exist; convenience only, not indexed)
[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Headers – explicit indexability signals, security, and caching
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
